<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 资源不存在</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='48'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9f9f9;
      color: #333;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .code {
      font-size: 3.5rem;
      font-weight: 700;
      color: #4caf50;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 0.5rem;
    }
    p {
      font-size: 0.95rem;
      color: #666;
      margin: 0 0 1.5rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      background: #4caf50;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-size: 0.95rem;
      transition: background 0.2s ease;
    }
    a.btn:hover {
      background: #43a047;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>资源不存在</h1>
    <p>您请求的图片或路径未找到，可能已被移动或链接拼写有误。</p>
    <a class="btn" href="/">返回 CDN 文件索引</a>
  </div>
</body>
</html>
